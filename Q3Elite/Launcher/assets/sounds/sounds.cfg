; Launcher UI sound file mapping for quick testing.
; Filenames are loaded from assets/sounds/launcher/.
; Edit a value and restart the launcher to test a different sound.

[launcher]
hover = sfx_ui_mm_mouseover_link.ogg
click = sfx_ui_mm_click.ogg
nav_back = sfx_ui_mm_click_back.ogg
nav_forward = sfx_ui_mm_click_forward.ogg
start_button = sfx_ui_mm_play_now.ogg
startup = sfx_ui_draft_select_champ_confirm.ogg
toggle_on = sfx_ui_mm_click_forward.ogg
toggle_off = sfx_ui_mm_click_back.ogg
list_hover = sfx_ui_mm_mouseover_link.ogg
list_scroll = sfx_ui_mm_lore_list_down.ogg
list_select = sfx_ui_mm_click_sublevel_01.ogg
map_hover = sfx_ui_mm_mouseover_static.ogg
map_select = sfx_ui_mm_click_sublevel_01.ogg
update_available = sfx_ui_mm_new_challenge.ogg
notify = sfx_ui_matchmaking_match_found.ogg

; Per-sound mixer: 0 mutes this sound, 100 uses its master slider level.
[volume]
hover = 70
click = 70
nav_back = 30
nav_forward = 30
start_button = 70
startup = 50
toggle_on = 30
toggle_off = 30
list_hover = 70
list_scroll = 20
list_select = 100
map_hover = 35
map_select = 100
update_available = 100
notify = 70
